spring:
  application:
  - name: chatmate
  datasource:
    url: jdbc:postgresql://localhost:5432/chatmate
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
#    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        hbm2ddl:
#          schema-generation:
#            scripts:
#              action: create
#              create-target: src/main/resources/schema.sql
#            create-source: metadata
#          delimiter: ;
#        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri-template: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope: openid,profile,email
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  servlet:
    multipart:
      location: D:\\Projects\\chat_mate_project\\chat-mate-api\\
      max-file-size: 10MB
      max-request-size: 100MB
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-on-validation-error: true
  sql:
   init:
     mode: never

logging:
  level:
    org:
      springframework:
#        sql: DEBUG
        # security: DEBUG
        # web:
        #   filter:
        #     CommonsRequestLoggingFilter: DEBUG
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

springdoc:
  api-docs:
    title: ChatMate API
    description: API documentation for the ChatMate backend
    version: OPENAPI_3_0